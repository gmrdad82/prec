[package]
name = "prec"
version = "1.4.6"
edition = "2024"
description = "Deterministic recordings of terminal apps: a VHS alternative that replays a pty session frame by frame in headless Chromium into exact video and PNG masters"
license = "MIT"
repository = "https://github.com/gmrdad82/prec"
homepage = "https://pitomd.com"
publish = false

[[bin]]
name = "prec"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
nix = { version = "0.28", default-features = false, features = ["signal", "sched", "hostname"] }
pito-codecs = { git = "https://github.com/gmrdad82/pito-codecs", tag = "v1.16.3", default-features = false, features = ["h264", "mp4", "filter", "png"] }
png = "0.18"
portable-pty = "0.9.0"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tiny-skia = "0.11"
toml = "0.9"
ttf-parser = "0.25"
vt100 = "0.16.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
